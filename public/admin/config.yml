backend:
  name: github
  repo: gte868d/garrison-portfolio-site
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Industry", name: "industry", widget: "string"}
      - {label: "Materials", name: "materials", widget: "string"}
      - {label: "Display Type", name: "type", widget: "string"}
      - {label: "Client", name: "client", widget: "string", required: false}
      - {label: "Year", name: "year", widget: "string"}
      - {label: "Featured", name: "featured", widget: "boolean", default: true}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
      - label: "Sketches"
        name: "sketches"
        widget: "list"
        required: false
        fields:
          - {label: "Image", name: "image", widget: "image"}
      - label: "Execution Photos"
        name: "photos"
        widget: "list"
        required: false
        fields:
          - {label: "Image", name: "image", widget: "image"}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Site Configuration"
        name: "config"
        file: "content/settings/config.json"
        fields:
          - {label: "Site Title", name: "title", widget: "string"}
          - {label: "Site Description", name: "description", widget: "text"}
          - {label: "Logo", name: "logo", widget: "image", required: false}
          - {label: "Logo Dark Mode", name: "logoDark", widget: "image", required: false}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string"}
          - {label: "Show Logo or Text", name: "showLogo", widget: "boolean", default: false}
      
      - label: "Homepage Hero"
        name: "hero"
        file: "content/settings/hero.json"
        fields:
          - {label: "Headline Line 1", name: "headline1", widget: "string", default: "Fast ideation."}
          - {label: "Headline Line 2", name: "headline2", widget: "string", default: "Deep exploration."}
          - {label: "Headline Line 3 (Highlighted)", name: "headline3", widget: "string", default: "Solutions that ship."}
          - {label: "Subheadline", name: "subheadline", widget: "text", default: "20 years solving how products meet consumers through systematic design thinking and AI-integrated workflows."}
          - {label: "Button Text", name: "buttonText", widget: "string", default: "Explore Work"}
      
      - label: "Renderings Gallery"
        name: "renderings"
        file: "content/settings/renderings.json"
        fields:
          - label: "Renderings"
            name: "renderings"
            widget: "list"
            summary: "{{fields.title}} - {{fields.category}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - {label: "Retail - Permanent", value: "retail-permanent"}
                  - {label: "Retail - Semi-Permanent", value: "retail-semi-permanent"}
                  - {label: "Retail - Temporary", value: "retail-temporary"}
                  - {label: "Retail Store Environment", value: "retail-store-environment"}
                  - {label: "Retail Decor", value: "retail-decor"}
                  - {label: "Trade Show", value: "trade-show"}
                  - {label: "Product Design", value: "product"}
                  - {label: "Signage", value: "signage"}
                  - {label: "Conceptual", value: "conceptual"}
              - {label: "Image", name: "image", widget: "image"}
      
      - label: "About Page"
        name: "about"
        file: "content/settings/about.json"
        fields:
          - {label: "Bio Content", name: "bio", widget: "markdown"}
